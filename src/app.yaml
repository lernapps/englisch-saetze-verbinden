format: 2
strand: englisch/grammatik
title: Sätze verbinden mit Satzstreifen
intro: In der Millbrook School hängt Mr Hill, der Englischlehrer, eine Satzstreifen-Wand an die Rückwand des Klassenzimmers. Die Schüler:innen Sophie, Ellie, Peter und Amir hängen Streifen und Verbindungskarten daran. Du lernst, kurze englische Sätze zu längeren zu verbinden, mit who, which, that und whose eine Person oder Sache genauer zu beschreiben und mit if zu sagen, was unter einer Bedingung passiert. Ab Kapitel 2 liest du ihre Chats, Tagebücher und Artikel und lernst Relativsätze ohne Relativkarte und mit Kommas, although und whereas, if-Sätze für Gedachtes und Vergangenes, I wish und die indirekte Rede.
languages: [de]
scope:
  text: Die App erklärt für Kinder und Jugendliche im Englischunterricht, wie man englische Sätze verbindet. Jeder Satz ist ein Satzstreifen, jede Verbindungsart eine Karte. Kapitel 1 (erstes und zweites Lernjahr) behandelt die Konjunktionen and, but, or, because, so und when, that-Sätze, notwendige Relativsätze mit who, which, that und whose und if-Sätze mit if im simple present und will im anderen Satz. Die Kapitel 2 bis 4 (Klasse 7 und 8) behandeln Relativsätze ohne Relativpronomen, nicht notwendige Relativsätze mit Kommas, although, while, whereas und so that, if-Sätze für Gedachtes (Typ 2) und Vergangenes (Typ 3), I wish und If only, und die indirekte Rede mit und ohne Zeitverschiebung sowie indirekte Aufforderungen. Beispiele und Lesestücke stammen aus dem Alltag von Sophie, Ellie, Peter und Amir.
  out:
    - Die Zeitformen selbst (steht im Explainer „Zeiten auf dem Zeitstrahl“)
    - Fragen im einfachen Satz (steht im Explainer „Sätze bauen“)
    - Infinitiv und Gerundium (steht im Explainer „Verbketten“)
    - Verbindungswörter für Erzählung und Argumentation
    - Indirekte Fragen, satzbezogenes which, cleft sentences, Partizipialsätze und die Formen auf -ing (Kapitel 5, später)
    - Gemischte if-Sätze und Inversion in if-Sätzen
chapters: [saetze-verbinden, relativsaetze-2, was-waere-wenn, weitersagen]
