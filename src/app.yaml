format: 2
strand: englisch/grammatik
title: Sätze verbinden mit Satzstreifen
intro: In der Millbrook School hängt Mr Hill, der Englischlehrer, eine Satzstreifen-Wand an die Rückwand des Klassenzimmers. Die Schüler:innen Sophie, Ellie, Peter und Amir hängen Streifen und Verbindungskarten daran. Du lernst, kurze englische Sätze zu längeren zu verbinden, mit who, which, that und whose eine Person oder Sache genauer zu beschreiben und mit if zu sagen, was unter einer Bedingung passiert. Ab Kapitel 2 liest du Chats, Tagebücher, Artikel, E-Mails und Berichte und lernst Relativsätze ohne Relativkarte und mit Kommas, although und whereas, if-Sätze für Gedachtes und Vergangenes, I wish, die indirekte Rede, indirekte Fragen, Betonung und verkürzte Sätze mit Partizip.
languages: [de]
scope:
  text: Die App erklärt für Kinder und Jugendliche im Englischunterricht, wie man englische Sätze verbindet. Jeder Satz ist ein Satzstreifen, jede Verbindungsart eine Karte. Kapitel 1 (Klasse 5 und 6) behandelt die Konjunktionen and, but, or, because, so und when, that-Sätze, notwendige Relativsätze mit who, which, that und whose und if-Sätze mit if im simple present und will im anderen Satz. Die Kapitel 2 bis 4 (Klasse 7 und 8) behandeln Relativsätze ohne Relativpronomen, nicht notwendige Relativsätze mit Kommas, although, while, whereas und so that, if-Sätze für Gedachtes (Typ 2) und Vergangenes (Typ 3), I wish und If only, und die indirekte Rede mit und ohne Zeitverschiebung sowie indirekte Aufforderungen. Kapitel 5 (Klasse 9 und 10) behandelt indirekte Fragen, satzbezogenes which, Hervorhebung mit It is … that und What … is …, Partizipien statt Relativsatz, Partizipialsätze und die Formen auf -ing. Beispiele und Lesestücke der Kapitel 1 bis 4 stammen aus dem Alltag von Sophie, Ellie, Peter und Amir, die Lesestücke von Kapitel 5 sind erfundene, aber realistische Fälle mit Daten, in denen Sophie schreibt.
  out:
    - Die Zeitformen selbst (steht im Explainer „Zeiten auf dem Zeitstrahl“)
    - Fragen im einfachen Satz (steht im Explainer „Sätze bauen“)
    - Verbketten im Einzelnen (steht im Explainer „Verbketten“)
    - Verbindungswörter für Erzählung und Argumentation
    - Gemischte if-Sätze und Inversion in if-Sätzen
chapters: [saetze-verbinden, relativsaetze-2, was-waere-wenn, weitersagen, verkuerzen-betonen]
