# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Ich wünschte, … Wünsche und Bedauern mit I wish"
description: "Amir schreibt in seinem Blog über ein verlorenes Finale. Du lernst, mit I wish und If only Wünsche und Bedauern auszudrücken."
competencies: [i-wish]
scope: Die Seite führt I wish und If only ein, um Wünsche und Bedauern über etwas auszudrücken, das nicht so ist oder nicht so war. Nach wish gilt dieselbe Verschiebung wie im Streifen mit if. Für einen Wunsch über jetzt steht das simple past (I wish I were faster, bei I, he, she, it auch was), für Bedauern über früher das past perfect (I wish I had practised more), für Ärger über andere oder Dinge, die sich ändern sollen, would plus Grundform (I wish he would stop). Would steht nicht für einen Wunsch über sich selbst (nicht I wish I would have). If only ist die stärkere Form mit denselben Zeitformen. Die Seite arbeitet mit einem erfundenen Blogeintrag von Amir über ein verlorenes Finale, die Absätze sind nummeriert. Mr Hill ist auch Trainer der Fußball-AG. Nicht hier, weil es andere Seiten sind. Wishes mit to-Infinitiv (I wish to go), hope und der Gebrauch von wish im Sinn von wünschen (I wish you luck).
blocks:
  - type: section
    id: einstieg
    title: Wie klingt ein Wunsch?
    blocks:
      - type: text
        text: "Amir hat mit seinem Team das Finale der Schule verloren. Am Sonntagabend schreibt er in seinem Blog, was er sich wünscht. Davor eine Frage zur letzten Seite."
      - type: single-choice
        id: wish-start
        text: "Peter hat das Rennen nicht gewonnen. Welche Form steht im Streifen mit if in „If Peter had practised more, he would have won“?"
        options:
          - text: past perfect, had practised
            correct: true
            info: Es geht um früher.
          - text: simple past, practised
            correct: false
            info: Steht vor practised nichts?
          - text: would plus 3. Form, would have practised
            correct: false
            info: Gehört would have in den if-Streifen?
        explanation: Gedachtes über früher steht im if-Streifen im past perfect.
        links:
          - title: Lernlandkarte Englisch · If-Sätze Typ 3
            url: https://lernapps.net/apps/map/englisch/c/if-satz-3/
      - type: text
        text: "**Das kannst du danach:** Du drückst mit „I wish …“ und „If only …“ Wünsche und Bedauern aus."
  - type: section
    id: lesen
    title: Amirs Blog
    blocks:
      - type: text
        text: "Amir ist 13. Ellie hat ihm geraten, seine Gedanken aufzuschreiben. Im Text kommt Mr Hill vor, der auch die Fußball-AG leitet. Jeder Absatz hat eine Nummer. Achte beim Lesen auf wish, if only und die Zeitform danach."
      - type: table
        caption: Amirs Blog · Absatz 1 und 2
        header: [Nr, Eintrag]
        rows:
          - [
              "1",
              "It is Sunday evening, and I am still sad about the final. Our team lost three to two yesterday. Ellie says writing helps, so here are my wishes.",
            ]
          - [
              "2",
              "First, a wish about now. I wish I were faster. The boys in 8A run like rabbits, and I always arrive too late.",
            ]
      - type: vocabulary
        caption: Randglossar · Absatz 1 und 2
        languages: { source: de, target: en }
        entries:
          - { target: "final", source: "Endspiel" }
          - { target: "team", source: "Mannschaft" }
          - { target: "wish", source: "Wunsch / wünschen" }
          - { target: "rabbit", source: "Kaninchen" }
      - type: table
        caption: Amirs Blog · Absatz 3
        header: [Nr, Eintrag]
        rows:
          - [
              "3",
              "Now the things I regret. I wish I had practised more. We only trained twice a week, and I often stayed at home.",
            ]
      - type: vocabulary
        caption: Randglossar · Absatz 3
        languages: { source: de, target: en }
        entries:
          - { target: "regret", source: "bedauern" }
          - { target: "practise", source: "üben" }
          - { target: "train", source: "trainieren" }
          - { target: "twice a week", source: "zweimal pro Woche" }
      - type: table
        caption: Amirs Blog · Absatz 4
        header: [Nr, Eintrag]
        rows:
          - [
              "4",
              "I also wish I had listened to Mr Hill. He told us to stay calm, but I got angry after the first goal. If only I had stayed calm! I would not have missed my shot.",
            ]
      - type: vocabulary
        caption: Randglossar · Absatz 4
        languages: { source: de, target: en }
        entries:
          - { target: "calm", source: "ruhig" }
          - { target: "angry", source: "wütend" }
          - { target: "goal", source: "Tor" }
          - { target: "shot", source: "Schuss" }
      - type: table
        caption: Amirs Blog · Absatz 5 und 6
        header: [Nr, Eintrag]
        rows:
          - [
              "5",
              "And one more thing. I wish my little brother would stop taking my boots. Yesterday I looked for them for ten minutes. If only he would ask me first!",
            ]
          - [
              "6",
              "Ellie read this and laughed. She says wishing is easy, but changing is better. So I will practise on Mondays and Thursdays. Next year, we will win the final.",
            ]
      - type: vocabulary
        caption: Randglossar · Absatz 5 und 6
        languages: { source: de, target: en }
        entries:
          - { target: "boots", source: "Fußballschuhe" }
          - { target: "stop", source: "aufhören" }
          - { target: "change", source: "ändern" }
  - type: section
    id: neu
    title: Nach wish rückt die Form zurück
    blocks:
      - type: text
        text: "Schau in den Blog. Amir schreibt „I wish I **were** faster“, obwohl es um jetzt geht. Er ist nicht schnell, und er wünscht sich, es wäre anders. Nach **wish** gilt dieselbe Verschiebung wie im Streifen mit if: Die Form rückt auf dem Zeitstrahl nach links. Für **jetzt** steht das simple past. Für **früher** steht das past perfect (Absatz 3: „I wish I had practised more“). Ärgerst du dich über jemand anderen oder über etwas, das sich ändern soll, steht **would** plus Verb (Absatz 5). **If only** ist die stärkere Form und hat dieselben Zeitformen."
      - type: figure
        image: images/satzstreifen-i-wish.svg
        alt: "Vier Streifen mit gelben Karten und darunter ein Zeitstrahl. Die ersten drei haben den Streifen „I“, die gelbe Karte „wish“ und einen Streifen: „it were summer.“ mit dem Hinweis simple past und jetzt, „I had called her.“ mit past perfect und früher, „she would stop.“ mit would und Veränderung. Der vierte hat die gelbe Karte „If only“ und den Streifen „it were summer.“ mit dem Hinweis stärker als wish. Unten ein Zeitstrahl mit früher, jetzt und später und einem Pfeil einen Schritt nach links."
        caption: Die gelbe Karte ist wish oder If only. Nach ihr rückt die Form auf dem Zeitstrahl einen Schritt nach links. Mit would wünschst du dir, dass sich etwas ändert.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Klassenzimmer-Poster · Wünsche mit wish
        header: [Du sagst, Form nach wish, Beispiel]
        rows:
          - [Wunsch für jetzt, simple past, I wish I had a bigger room.]
          - [Bedauern über früher, past perfect, I wish I had stayed longer.]
          - [Ärger über andere, would + Verb, I wish the bus would come.]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Für dich selbst steht nach wish kein would.** Es heißt „I wish I had a new coat“ und nicht „I wish I would have a new coat“. Bei I, he, she und it sind were und was möglich: „I wish she were here“. Mit would wünschst du dir, dass **ein anderer** etwas tut oder lässt.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: vocabulary
        caption: Wörter für die Übung
        languages: { source: de, target: en }
        entries:
          - { target: "neighbour", source: "Nachbar / Nachbarin" }
          - { target: "quiet", source: "leise, ruhig" }
          - { target: "loudly", source: "laut" }
      - type: true-false
        id: wish-verstehen
        text: Ellie meint, dass Wünschen allein schon hilft.
        answer: false
        explanation: Ellie sagt, Wünschen ist leicht, aber Ändern ist besser (Absatz 6).
        links:
          - title: Lernlandkarte Englisch · Wünsche mit I wish
            url: https://lernapps.net/apps/map/englisch/c/i-wish/
      - type: number
        id: wish-beleg
        text: In welchem Absatz ärgert sich Amir über seinen kleinen Bruder? Gib die Nummer ein.
        answer: 5
        hint: Es geht um Fußballschuhe.
        tolerance: 0
        explanation: Amir ärgert sich über die Fußballschuhe in Absatz 5.
        links:
          - title: Lernlandkarte Englisch · Wünsche mit I wish
            url: https://lernapps.net/apps/map/englisch/c/i-wish/
      - type: single-choice
        id: wish-passt
        text: Die Nachbarn singen jeden Abend laut. Ellie sagt ihrer Mutter, was sie sich wünscht. Welcher Satz passt?
        options:
          - text: I wish the neighbours will be quiet
            correct: false
            info: Passt will nach wish?
          - text: I wish the neighbours would be quiet
            correct: true
            info: Die Nachbarn sind gemeint, nicht Ellie.
          - text: I wish the neighbours are quiet
            correct: false
            info: Passt das simple present nach wish?
        explanation: Hier geht es um andere Personen. Nach wish steht dann would plus Verb.
        links:
          - title: Lernlandkarte Englisch · Wünsche mit I wish
            url: https://lernapps.net/apps/map/englisch/c/i-wish/
      - type: language-task
        id: wish-luecken
        languages: { source: de, target: en }
        mode: gap
        task: Schreibe die richtige Form in die Lücke.
        hint: Jetzt braucht das simple past, früher das past perfect, bei Ärger would.
        form: { case: hint, punctuation: ok, apostrophe: ok }
        items:
          - source: Ich wünschte, ich hätte mehr Freizeit.
            target: I wish I [had] more free time.
            mistakes:
              - answer: I wish I have more free time.
                message: Rückt die Form nach wish zurück?
          - source: Ich wünschte, ich wäre schon in den Ferien.
            target: I wish I [were|was] on holiday now.
            mistakes:
              - answer: I wish I would be on holiday now.
                message: Wünschst du dir etwas für dich selbst?
          - source: Ich wünschte, ich wäre gestern früher nach Hause gegangen.
            target: I wish I [had gone|had left] home earlier yesterday.
            mistakes:
              - answer: I wish I went home earlier yesterday.
                message: Welche Zeitform passt zu gestern?
          - source: Ich wünschte, du würdest nicht so laut singen.
            target: I wish you [would not|wouldn't|did not|didn't] sing so loudly.
            mistakes:
              - answer: I wish you don't sing so loudly.
                message: Wie sagst du Ärger über andere?
      - type: language-task
        id: wish-bilden
        languages: { source: de, target: en }
        task: Schreibe einen Satz mit I wish oder If only, der das Gegenteil des Cues wünscht.
        hint: Rücke die Form einen Schritt nach links.
        form: { case: hint, punctuation: ok, apostrophe: ok }
        items:
          - cue: I do not have a bike · I wish
            target: (I wish I had a bike.|If only I had a bike.)
            mistakes:
              - answer: I wish I would have a bike.
                message: Passt would zu einem Wunsch für dich selbst?
          - cue: I did not go to the party · I wish
            target: (I wish I had gone to the party.|If only I had gone to the party.|I wish I'd gone to the party.|If only I'd gone to the party.)
            mistakes:
              - answer: I wish I went to the party.
                message: Ist das Bedauern über früher?
          - cue: Amir does not listen · I wish · he listens
            target: (I wish Amir would listen.|I wish Amir listened.|I wish he would listen.|I wish he listened.|If only Amir would listen.|If only Amir listened.|If only he would listen.|If only he listened.|I wish he'd listen.|If only he'd listen.)
            mistakes:
              - answer: I wish Amir will listen.
                message: Passt will nach wish?
      - type: language-task
        id: wish-uebersetzen
        languages: { source: de, target: en }
        task: Übersetze den Satz.
        hint: Die Form rückt einen Schritt nach links.
        form: { case: hint, punctuation: ok, apostrophe: ok }
        items:
          - source: Ich wünschte, ich könnte gut Gitarre spielen.
            target: (I wish I could play the guitar well.|I wish I could play guitar well.|I wish I was able to play the guitar well.|I wish I was able to play guitar well.|I wish I were able to play the guitar well.|I wish I were able to play guitar well.)
            mistakes:
              - answer: I wish I can play the guitar well.
                message: Wie wird can nach wish?
          - source: Wenn ich nur früher gekommen wäre!
            target: (If only I had come earlier!|If only I had come sooner!|If only I had arrived earlier!|If only I had arrived sooner!|If only I had been earlier!|If only I had been sooner!|I wish I had come earlier!|I wish I had come sooner!|I wish I had arrived earlier!|I wish I had arrived sooner!|I wish I had been earlier!|I wish I had been sooner!|If only I'd come earlier!|If only I'd come sooner!|If only I'd arrived earlier!|If only I'd arrived sooner!|If only I'd been earlier!|If only I'd been sooner!|I wish I'd come earlier!|I wish I'd come sooner!|I wish I'd arrived earlier!|I wish I'd arrived sooner!|I wish I'd been earlier!|I wish I'd been sooner!)
            mistakes:
              - answer: If only I would have come earlier.
                message: Was steht nach If only für früher?
      - type: language-task
        id: wish-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: i-wish-i-lived-closer-to-my-cousins.mp3
            target: I wish I lived closer to my cousins.
          - audio: i-wish-i-had-brought-my-jacket-today.mp3
            target: I wish I had brought my jacket today.
          - audio: i-wish-my-parents-would-call-me-more-often.mp3
            target: I wish my parents would call me more often.
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: wish-nachsprechen
        language: en
        items:
          - audio: if-only-i-had-more-money-for-the-holidays.mp3
            text: If only I had more money for the holidays.
          - audio: i-wish-we-had-a-cinema-in-the-village.mp3
            text: I wish we had a cinema in the village.
          - audio: i-wish-the-rain-would-stop.mp3
            text: I wish the rain would stop.
        hint: Sprich langsam nach. Wish betonst du stark.
      - type: open-task
        id: wish-meinung
        task: "Ellie sagt: Wünschen ist leicht, Ändern ist besser. Schreibe zwei bis drei Sätze: ein Wunsch mit I wish und was du tun kannst."
        hint: Für das, was du tun kannst, nimmst du will.
        points:
          - text: Ein Satz drückt mit I wish einen Wunsch oder ein Bedauern aus.
            source: /was-waere-wenn/i-wish/#neu
          - text: Nach wish steht die richtige Form, simple past für jetzt oder past perfect für früher, nicht would für einen Wunsch über sich selbst.
            source: /was-waere-wenn/i-wish/#neu
          - text: Ein Satz sagt, was die Person tun kann, damit es besser wird.
            source: /was-waere-wenn/i-wish/#lesen
          - text: Es sind ganze Sätze mit Punkt am Ende.
            kind: form
        solution: |
          I wish I had more time for my friends. I will call them every Sunday.
  - type: section
    id: weiter
    title: Rückblick auf das Kapitel
    blocks:
      - type: text
        text: "Amir hat seine Liste geschrieben. Du kennst jetzt fünf Muster für Gedachtes. Die Tabelle zeigt sie alle."
      - type: table
        caption: Klassenzimmer-Poster · Gedachtes
        header: [Du sagst, Form]
        rows:
          - [if Typ 2 (jetzt), "if + simple past, would + Verb"]
          - [if Typ 3 (früher), "if + past perfect, would have + 3. Form"]
          - [wish für jetzt, wish + simple past]
          - [wish für früher, wish + past perfect]
          - [wish bei Ärger, wish + would + Verb]
      - type: text
        text: "Im nächsten Kapitel „Weitersagen, was jemand sagt“ gibst du weiter, was andere gesagt haben."
