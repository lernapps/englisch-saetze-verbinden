<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 276" role="img">
  <title>Vier Streifen mit der gelben Karte wish oder If only und einem Streifen mit einer Zeitform, jeweils mit einem kurzen Hinweis rechts daneben</title>
  
  <rect width="480" height="276" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Nach wish rückt die Form einen Schritt zurück</text><rect x="10" y="40" width="34" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="27.0" y="63.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">I</text><rect x="50" y="42" width="62" height="30" rx="15.0" fill="#f9a825"/><text x="81.0" y="63.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">wish</text><rect x="118" y="40" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="193.0" y="63.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">it were summer.</text><text x="278" y="63" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">simple past · jetzt</text><rect x="10" y="92" width="34" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="27.0" y="115.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">I</text><rect x="50" y="94" width="62" height="30" rx="15.0" fill="#f9a825"/><text x="81.0" y="115.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">wish</text><rect x="118" y="92" width="170" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="203.0" y="115.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">I had called her.</text><text x="298" y="115" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">past perfect · früher</text><rect x="10" y="144" width="34" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="27.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">I</text><rect x="50" y="146" width="62" height="30" rx="15.0" fill="#f9a825"/><text x="81.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">wish</text><rect x="118" y="144" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="193.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">she would stop.</text><text x="278" y="167" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">would · Veränderung</text><rect x="10" y="198" width="84" height="30" rx="15.0" fill="#f9a825"/><text x="52.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">If only</text><rect x="102" y="196" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="177.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">it were summer.</text><text x="262" y="219" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">stärker als wish</text><text x="10" y="262" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Ein Wunsch oder ein Bedauern: Die Wirklichkeit ist anders.</text>
</svg>
