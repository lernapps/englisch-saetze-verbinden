font-weight="bold" fill="#333">gleiches Subjekt</text><text x="10" y="276" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">Vorher fertig</text><rect x="10" y="290" width="60" height="30" rx="15.0" fill="#7f8c8d"/><text x="40.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">when</text><rect x="78" y="288" width="250" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="203.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">she had washed the car,</text><rect x="336" y="288" width="140" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="406.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">she went in.</text><path d="M40 328 L40.0 338.0" stroke="#333" stroke-width="3" fill="none"/><polygon points="40,350 33.0,338.0 47.0,338.0" fill="#333"/><rect x="10" y="366" width="160" height="30" rx="15.0" fill="#4e342e"/><text x="90.0" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">Having washed</text><rect x="178" y="364" width="100" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="228.0" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">the car,</text><rect x="286" y="364" width="140" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="356.0" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">she went in.</text><text x="10" y="424" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="normal" fill="#333">Having plus 3. Form: erst das eine, dann das andere</text><text x="10" y="456" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="bold" fill="#444">Legende</text><rect x="10" y="468" width="60" height="30" rx="15.0" fill="#7f8c8d"/><text x="40.0" y="489.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">when</text><text x="78" y="489" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="normal" fill="#333">Konjunktion</text><rect x="190" y="468" width="90" height="30" rx="15.0" fill="#4e342e"/><text x="235.0" y="489.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">Partizip</text><text x="288" y="489" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="normal" fill="#333">ersetzt Konjunktion + Subjekt</text>
