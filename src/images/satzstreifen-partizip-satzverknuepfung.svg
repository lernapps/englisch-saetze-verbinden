<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 504" role="img">
  <title>Satzstreifen: Die Karte when und das erste Subjekt fallen weg, das Partizip steht vorn und gehört zum Subjekt des zweiten Streifens</title>
