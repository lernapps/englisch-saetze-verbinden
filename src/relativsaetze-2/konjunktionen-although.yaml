# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Although, while, whereas, so that: Gegensatz und Absicht"
description: "Die Schülerzeitung der Millbrook School berichtet über die Herbstwoche. Du lernst, wie man Gegensätze und Absichten mit although, while, whereas und so that sagt."
competencies: [konjunktionen-although]
scope: Die Seite führt die Konjunktionen although, while, whereas und so that ein. Although (obwohl) steht vor einem ganzen Streifen mit Subjekt und Verb und nennt etwas, das trotzdem nicht das Gegenteil bewirkt. Im selben Satz steht nie although und but. While und whereas (während, wohingegen) stellen zwei Dinge nebeneinander, die man vergleicht. So that (damit) nennt die Absicht und hat im folgenden Streifen meist can, could, will oder would. Die zwei Streifen dürfen die Plätze tauschen. Steht although vorn, trennt ein Komma die zwei Streifen, steht es in der Mitte, steht meist kein Komma. Vor while und whereas steht in der Mitte ein Komma, wenn sie einen Gegensatz zeigen. Die Seite arbeitet mit einem Artikel der Schülerzeitung, die Absätze sind nummeriert. Nicht hier, weil es andere Seiten oder Kapitel sind. Because, so und but aus Kapitel 1, Relativsätze, while und when als Zeitangabe (während etwas anderes passiert) und die Konjunktion in order to mit Infinitiv.
blocks:
  - type: section
    id: einstieg
    title: Welche Karte zeigt einen Gegensatz?
    blocks:
      - type: text
        text: "Am Donnerstag liegt die neue Schülerzeitung der Millbrook School im Klassenzimmer. Ellie und Amir haben für sie einen Artikel über die Herbstwoche geschrieben. Du liest ihn gleich. Davor eine Frage zu den Verbindungskarten aus Kapitel 1."
      - type: single-choice
        id: alt-start
        text: "Welche Karte aus Kapitel 1 sagt: Der zweite Streifen ist anders, als man nach dem ersten denkt?"
        options:
          - text: but
            correct: true
            info: But zeigt einen Gegensatz.
          - text: and
            correct: false
            info: Fügt der zweite Streifen nur etwas dazu?
          - text: so
            correct: false
            info: Sagt der zweite Streifen, was daraus folgt?
        explanation: But zeigt etwas Unerwartetes.
        links:
          - title: Lernlandkarte Englisch · Konjunktionen and, but, because
            url: https://lernapps.net/apps/map/englisch/c/konjunktionen/
      - type: text
        text: "**Das kannst du danach:** Du drückst Gegensätze mit although, while und whereas aus und sagst mit so that, wozu man etwas tut."
  - type: section
    id: lesen
    title: Der Artikel der Schülerzeitung
    blocks:
      - type: text
        text: "Der Artikel hat sechs Absätze. Jeder Absatz hat eine Nummer, damit du später sagen kannst, wo etwas steht. Beim Lesen: Achte auf die Wörter although, while, whereas und so that."
      - type: table
        caption: Millbrook School News · Autumn Week · Absatz 1
        header: [Nr, Absatz]
        rows:
          - [
              "1",
              "Autumn Week starts on Monday at Millbrook School. Although it is often wet in November, the first event is a walk in the park. Year 8 will go with Mr Hill so that they can collect leaves for the art room.",
            ]
      - type: vocabulary
        caption: Randglossar · Absatz 1
        languages: { source: de, target: en }
        entries:
          - { target: "wet", source: "nass" }
          - { target: "event", source: "Veranstaltung" }
          - { target: "collect", source: "sammeln" }
          - { target: "leaves", source: "Blätter" }
          - { target: "art room", source: "Kunstraum" }
      - type: table
        caption: Millbrook School News · Autumn Week · Absatz 2
        header: [Nr, Absatz]
        rows:
          - [
              "2",
              "While Year 8 makes posters for the week, Year 7 will write the programme. The posters will hang in the school hall so that everyone can see them.",
            ]
      - type: vocabulary
        caption: Randglossar · Absatz 2
        languages: { source: de, target: en }
        entries:
          - { target: "poster", source: "Plakat" }
          - { target: "programme", source: "Programm (Liste: was wann passiert)" }
          - { target: "hang", source: "hängen" }
          - { target: "hall", source: "Saal" }
      - type: table
        caption: Millbrook School News · Autumn Week · Absatz 3
        header: [Nr, Absatz]
        rows:
          - [
              "3",
              "The concert is on Wednesday evening. Although the hall is quite small, more than a hundred people can sit there. The music group practises every day so that the songs will sound good.",
            ]
      - type: vocabulary
        caption: Randglossar · Absatz 3
        languages: { source: de, target: en }
        entries:
          - { target: "concert", source: "Konzert" }
          - { target: "practise", source: "üben" }
      - type: table
        caption: Millbrook School News · Autumn Week · Absatz 4
        header: [Nr, Absatz]
        rows:
          - [
              "4",
              "Some students like quiet songs, whereas others prefer loud music. The group plays both kinds, so everyone will find a favourite.",
            ]
      - type: vocabulary
        caption: Randglossar · Absatz 4
        languages: { source: de, target: en }
        entries:
          - { target: "quiet", source: "leise" }
          - { target: "prefer", source: "lieber mögen" }
          - { target: "loud", source: "laut" }
          - { target: "both", source: "beide" }
          - { target: "kinds", source: "Arten" }
      - type: table
        caption: Millbrook School News · Autumn Week · Absatz 5
        header: [Nr, Absatz]
        rows:
          - [
              "5",
              "On Friday there is a book sale. Small books cost fifty pence, whereas big books cost two pounds. The money will buy new books for the library so that more students can borrow them.",
            ]
      - type: vocabulary
        caption: Randglossar · Absatz 5
        languages: { source: de, target: en }
        entries:
          - { target: "sale", source: "Verkauf" }
          - { target: "pence", source: "Pence (kleine britische Münze)" }
          - { target: "pound", source: "Pfund (britische Währung)" }
          - { target: "borrow", source: "sich ausleihen" }
      - type: table
        caption: Millbrook School News · Autumn Week · Absatz 6
        header: [Nr, Absatz]
        rows:
          - [
              "6",
              "Many students want to help although the work is hard. While some carry the boxes, others make the signs. We hope to see you there!",
            ]
