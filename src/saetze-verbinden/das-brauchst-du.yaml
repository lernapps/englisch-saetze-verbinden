# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Pronomen, simple present und will noch einmal kurz, bevor Mr Hill die Satzstreifen-Wand aufhängt.
recap: [englisch/personalpronomen, englisch/simple-present, englisch/will-future]
scope: Die Seite wiederholt nur, was die Satzstreifen brauchen, und führt sie ein. Wiederholt werden die Personalpronomen als Subjekt, das simple present mit dem -s bei he, she und it und das will-future (will plus Verb). Neu ist nur das Bild vom Satzstreifen, auf dem ein Satz steht, und von der Satzstreifen-Wand in Mr Hills Klassenzimmer. Neue Inhalte gibt es nicht, auch keine Übung.
blocks:
  - type: section
    id: einstieg
    title: Das solltest du schon können
    blocks:
      - type: text
        text: "Kannst du das schon? Du brauchst drei Dinge aus früheren Seiten. Erstens die **Personalpronomen** (I, he, they). Zweitens das **simple present** mit dem -s bei he, she und it. Drittens das **will-future**, also will plus Verb. Ein Satz hat ein **Subjekt** (wer?) und ein **Verb** (was passiert?). Die Tabelle ist ein Stück vom Klassenzimmer-Poster: Es sammelt Wörter und Formen."
      - type: table
        caption: Klassenzimmer-Poster · Wiederholung
        header: [Baustein, Beispiel]
        rows:
          - [Personalpronomen, "I, you, he, she, it, we, they"]
          - [simple present mit -s, Ellie plays football.]
          - [will plus Verb, We will win tomorrow.]
      - type: text
        text: "Nicht sicher? Hier kannst du es nachlesen: [Personalpronomen](https://lernapps.net/apps/map/englisch/c/personalpronomen/), [simple present](https://lernapps.net/apps/map/englisch/c/simple-present/) und [will-future](https://lernapps.net/apps/map/englisch/c/will-future/)."
  - type: section
    id: wand
    title: Die Satzstreifen-Wand
    blocks:
      - type: text
        text: "Mr Hill hängt in der Millbrook School ein Brett an die Rückwand des Klassenzimmers: die **Satzstreifen-Wand**. **Sophie** (11) kommt aus Deutschland und wohnt bei den Parkers, **Ellie** (11) ist ihre Gastschwester, **Peter** (9) Ellies kleiner Bruder, der auch in die Millbrook School geht, **Amir** (11) ein Freund. **Mr Hill** ist ihr Englischlehrer. Auf jeden Streifen kommt ein ganzer Satz. Mit bunten Karten verbinden die Kinder die Streifen."
      - type: figure
        image: images/satzstreifen-streifen.svg
        alt: "Drei weiße Streifen untereinander. Auf dem ersten steht „I play football every day.“, auf dem zweiten „Ellie plays football on Saturday.“ und auf dem dritten „We will win tomorrow.“ Rechts daneben stehen kleine Hinweise: ich, sie mit -s und will."
        caption: Ein Satz, ein Streifen. Jeder Streifen hat ein Subjekt und ein Verb.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: Auf der nächsten Seite hängen die Kinder die erste bunte Karte zwischen zwei Streifen.
