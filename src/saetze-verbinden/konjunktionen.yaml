# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Zwei Streifen, eine Karte: and, but, or, because, so, when"
description: "Mr Hill hängt in Millbrook die Satzstreifen-Wand auf. Du lernst, mit and, but, or, because, so und when zwei Sätze zu einem zu verbinden."
competencies: [konjunktionen]
scope: Die Seite führt die Satzstreifen und die Verbindungskarten ein. Ein Satzstreifen ist ein ganzer Satz mit Subjekt und Verb. Eine Verbindungskarte hängt zwei Streifen zu einem längeren Satz zusammen und sagt, wie sie zusammengehören. And fügt etwas hinzu, but zeigt einen Gegensatz, or lässt wählen, because nennt den Grund, so nennt die Folge und when sagt, wann etwas passiert. Vor because steht der Grund, vor so die Folge. Die Streifen bleiben ganze Sätze mit eigenem Subjekt. Ein Komma vor and, but, so und or ist hier nicht Thema und zählt nicht als Fehler. Nicht hier, weil es spätere Seiten sind. That-Sätze, Relativsätze und if-Sätze. Nicht hier, weil es spätere Kapitel sind. Although und whereas.
blocks:
  - type: section
    id: einstieg
    title: Zwei Streifen und eine Karte
    blocks:
      - type: figure
        image: images/szene-konjunktionen.svg
        alt: "Im Klassenzimmer hängt ein Brett mit zwei weißen Streifen: „Peter likes football.“ und „Amir likes football.“ Darunter hängen drei Karten: and, but und because. Sophie fragt in einer Sprechblase: „Which card fits?“ Neben Sophie stehen Peter, Ellie und Amir. Rechts steht Mr Hill."
        caption: "Von links: Sophie (Zöpfe), Peter (gelbe Jacke), Ellie (roter Pferdeschwanz), Amir (Brille) und Mr Hill (graue Haare). Sophie fragt."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Mr Hill hat im Klassenzimmer ein Brett an die Rückwand gehängt: die **Satzstreifen-Wand**. Auf jedem **Streifen** steht ein ganzer Satz. Peter hat geschrieben: „Peter likes football.“ Amir hat geschrieben: „Amir likes football.“ Like heißt mögen, football heißt Fußball. Sophie fragt: „Which card fits?“ Das heißt: Welche Karte passt? Eine **Verbindungskarte** soll die zwei Streifen zu einem Satz verbinden.
      - type: single-choice
        id: konjunktionen-start
        text: Peter und Amir mögen beide Fußball. Welche Karte verbindet die zwei Streifen zu einem Satz?
        options:
          - text: "and: Beides gilt, es kommt etwas dazu."
            correct: true
            info: Peter mag Fußball und Amir mag auch Fußball. Der zweite Streifen fügt etwas hinzu. Dafür steht and.
          - text: "but: Der zweite Streifen sagt das Gegenteil."
            correct: false
            info: Beide Streifen sagen dasselbe. Ein Gegensatz würde zu but passen, zum Beispiel „Peter likes football, but Amir likes tennis.“
          - text: "because: Der zweite Streifen nennt einen Grund."
            correct: false
            info: Dass Amir Fußball mag, ist kein Grund dafür, dass Peter Fußball mag. Because passt nur, wenn der zweite Streifen erklärt, warum der erste stimmt.
        explanation: Was dazukommt, verbindet and.
        links:
          - title: Lernlandkarte Englisch · Konjunktionen and, but, because
            url: https://lernapps.net/apps/map/englisch/c/konjunktionen/
      - type: text
        text: "**Das kannst du danach:** Du verbindest zwei kurze Sätze mit and, but, or, because, so oder when zu einem längeren Satz. Du weißt, welche Karte zu welchem Gedanken passt. Davor hast du wiederholt, wie ein Satz mit Pronomen und Verb aussieht."
      - type: table
        caption: Klassenzimmer-Poster · Neue Wörter
        header: [Ausdruck, Bedeutung]
        rows:
          - [tired, müde]
          - [hungry, hungrig]
          - [sandwich, belegtes Brot]
          - [early, früh]
          - [late, spät]
          - [sunny, sonnig]
          - [rain, regnen]
          - [stay, bleiben]
          - [smile, lächeln]
          - [homework, Hausaufgaben]
          - [fish, Fisch]
          - [tennis, Tennis]
  - type: section
    id: neu
    title: Die Verbindungskarten
    blocks:
      - type: text
        text: "Ein **Streifen** ist ein ganzer Satz mit einem Subjekt und einem Verb. Eine **Verbindungskarte** hängt zwei Streifen aneinander. Jede Karte sagt, wie die zwei Streifen zusammengehören. Die Streifen bleiben ganze Sätze: Hinter der Karte kommt wieder ein Subjekt."
      - type: figure
        image: images/satzstreifen-konjunktionen.svg
        alt: "Oben ein Satz aus drei Teilen: ein weißer Streifen „Ellie is tired.“, eine orange Karte „so“ und ein weißer Streifen „she goes to bed early.“ Darunter sechs bunte Karten mit ihrer Bedeutung: and dazu, but aber, or oder, because Grund, so Folge, when Zeit."
        caption: Streifen, Karte, Streifen. Unter den Karten steht, wofür jede gebraucht wird.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Klassenzimmer-Poster · Verbindungskarten
        header: [Karte, Bedeutung, Beispiel]
        rows:
          - [and, und (es kommt etwas dazu), Sophie reads a book and Ellie draws a picture.]
          - [but, aber (ein Gegensatz), Peter is small but he runs fast.]
          - [or, oder (du kannst wählen), You can take the bus or you can walk.]
          - [because, weil (der Grund), Ellie is happy because it is her birthday.]
          - [so, deshalb (die Folge), It is cold so I wear a jacket.]
          - [when, wenn (wann es passiert), Amir sings when he is happy.]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Hinter because steht der Grund, hinter so die Folge.** Beide Sätze sagen dasselbe, nur der Streifen mit der Karte wechselt: „We drink water because the sun is hot.“ ist dasselbe wie „The sun is hot so we drink water.“ Because und so sind nie in einem Satz.
      - type: table
        caption: Klassenzimmer-Poster · Wörter dieser Seite
        header: [Ausdruck, Bedeutung]
        rows:
          - [read, lesen]
          - [draw, zeichnen]
          - [picture, Bild]
          - [small, klein]
          - [fast, schnell]
          - [bus, Bus]
          - [walk, zu Fuß gehen]
          - [birthday, Geburtstag]
          - [cold, kalt]
          - [wear, tragen]
          - [jacket, Jacke]
          - [sing, singen]
          - [happy, froh]
          - [water, Wasser]
          - [drink, trinken]
          - [sun, Sonne]
          - [hot, heiß]
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: konjunktionen-zuordnen
        text: Welche Karte passt zu welchem Gedanken?
        pairs:
          - left: Es kommt etwas dazu.
            right: and
          - left: Der zweite Streifen sagt das Gegenteil.
            right: but
          - left: Du kannst zwischen zwei Dingen wählen.
            right: or
          - left: Der zweite Streifen nennt den Grund.
            right: because
          - left: Der zweite Streifen nennt die Folge.
            right: so
          - left: Der zweite Streifen sagt, wann etwas passiert.
            right: when
        explanation: Jede Karte hat ihre Aufgabe.
        links:
          - title: Lernlandkarte Englisch · Konjunktionen and, but, because
            url: https://lernapps.net/apps/map/englisch/c/konjunktionen/
      - type: language-task
        id: konjunktionen-karte
        languages: { source: de, target: en }
        mode: choice
        task: Welche Karte passt in die Lücke?
        form: { case: hint, punctuation: hint }
        items:
          - source: Es regnet, also bleiben wir zu Hause.
            target: It rains [so] we stay at home.
            distractors: [[because, but]]
            mistakes:
              - answer: It rains because we stay at home.
                message: Der Regen ist der Grund, das Zuhausebleiben die Folge. Die Folge hängt mit so an den Grund.
          - source: Sophie mag Pizza, aber sie mag keinen Fisch.
            target: Sophie likes pizza [but] she does not like fish.
            distractors: [[and, because]]
            mistakes:
              - answer: Sophie likes pizza and she does not like fish.
                message: Die zwei Streifen sagen Gegensätzliches. Dafür brauchst du but.
          - source: Peter ist froh, weil heute Samstag ist.
            target: Peter is happy [because] it is Saturday.
            distractors: [[so, but]]
            mistakes:
              - answer: Peter is happy so it is Saturday.
                message: Der Samstag ist der Grund für die gute Laune. Der Grund steht hinter because.
          - source: Wir können Fußball oder Tennis spielen.
            target: We can play football [or] we can play tennis.
            distractors: [[and, because]]
          - source: Mr Hill ist froh, wenn wir singen.
            target: Mr Hill is happy [when] we sing.
            distractors: [[because, so]]
      - type: ordering
        id: konjunktionen-ordnen
        text: Ordne die Wörter zu einem Satz.
        items:
          - Ellie
          - is
          - happy
          - because
          - she
          - has
          - a
          - bike
        explanation: Der Grund kommt hinter because.
        links:
          - title: Lernlandkarte Englisch · Konjunktionen and, but, because
            url: https://lernapps.net/apps/map/englisch/c/konjunktionen/
      - type: language-task
        id: konjunktionen-bilden
        languages: { source: de, target: en }
        task: Verbinde die zwei Streifen mit der Karte. Schreibe den ganzen Satz.
        form: { case: hint, punctuation: hint }
        items:
          - cue: Amir is hungry · he eats a sandwich · so
            target: Amir is hungry so he eats a sandwich.
            mistakes:
              - answer: Amir is hungry because he eats a sandwich.
                message: Grund und Folge sind vertauscht. Der Streifen vor so ist der Grund.
          - cue: Sophie is from Germany · she lives in England · but
            target: Sophie is from Germany but she lives in England.
            mistakes:
              - answer: Sophie is from Germany and she lives in England.
                message: "Die Streifen sind ein Gegensatz. Dafür brauchst du but."
          - cue: Ellie goes home · it is late · because
            target: Ellie goes home because it is late.
            mistakes:
              - answer: Ellie goes home so it is late.
                message: Der Grund kommt hinter because.
          - cue: we play football · it is sunny · when
            target: We play football when it is sunny.
            mistakes:
              - answer: We play football so it is sunny.
                message: Hier geht es um die Zeit. Dafür brauchst du when.
      - type: language-task
        id: konjunktionen-korrektur
        languages: { source: de, target: en }
        task: In jedem Satz hängt die falsche Karte. Schreibe den Satz richtig.
        form: { case: hint, punctuation: hint }
        items:
          - cue: Ellie is cold because she wears a jacket.
            target: Ellie is cold so she wears a jacket.
            accepted: [Ellie wears a jacket because she is cold.]
            mistakes:
              - answer: Ellie is cold because she wears a jacket.
                message: Noch nicht ganz. Die Jacke ist die Folge der Kälte.
          - cue: Amir likes tea so he does not like milk.
            target: Amir likes tea but he does not like milk.
            mistakes:
              - answer: Amir likes tea so he does not like milk.
                message: Noch nicht ganz. Die Streifen sind ein Gegensatz, nicht Grund und Folge.
          - cue: Peter sings and he is happy.
            target: Peter sings when he is happy.
            mistakes:
              - answer: Peter sings and he is happy.
                message: Noch nicht ganz. Der zweite Streifen sagt, wann Peter singt.
      - type: language-task
        id: konjunktionen-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: hint }
        items:
          - audio: ellie-reads-a-book-and-peter-plays-football.mp3
            target: Ellie reads a book and Peter plays football.
          - audio: sophie-is-tired-but-she-does-her-homework.mp3
            target: Sophie is tired but she does her homework.
          - audio: amir-smiles-when-he-sees-sophie.mp3
            target: Amir smiles when he sees Sophie.
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: konjunktionen-nachsprechen
        language: en
        items:
          - audio: we-stay-at-home-because-it-is-sunday.mp3
            text: We stay at home because it is Sunday.
          - audio: you-can-drink-tea-or-you-can-drink-water.mp3
            text: You can drink tea or you can drink water.
          - audio: amir-has-a-brother-but-peter-has-a-sister.mp3
            text: Amir has a brother but Peter has a sister.
        hint: Hör den Satz zuerst. Sprich dann langsam nach. Die Karte in der Mitte betonst du kaum.
      - type: open-task
        id: konjunktionen-wand
        task: "Hänge zwei eigene Streifen an die Wand. Schreibe zwei Sätze über dich oder deine Klasse. Verbinde in jedem Satz zwei Gedanken mit einer Karte: and, but, or, because, so oder when."
        points:
          - text: Jeder Satz hat zwei Streifen mit eigenem Subjekt und Verb und eine Verbindungskarte dazwischen.
            source: /saetze-verbinden/konjunktionen/#neu
          - text: Die Karte passt zur Beziehung der zwei Streifen (dazu, Gegensatz, Wahl, Grund, Folge oder Zeit).
            source: /saetze-verbinden/konjunktionen/#neu
          - text: Es sind ganze Sätze mit Punkt am Ende.
            kind: form
        solution: |
          I like football but I do not like tennis. I am happy because it is Friday.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "An der Satzstreifen-Wand hängen jetzt lange Sätze. Ellie hängt einen neuen Streifen auf, der mit „I think“ beginnt. Dahinter fehlt noch etwas. Auf der nächsten Seite lernst du, was hinter „I think“ kommt."
