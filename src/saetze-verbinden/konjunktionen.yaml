# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Zwei Streifen, eine Karte: and, but, or, because, so, when"
description: "Mr Hill hängt in Millbrook die Satzstreifen-Wand auf. Du lernst, mit and, but, or, because, so und when zwei Sätze zu einem zu verbinden."
competencies: [konjunktionen]
scope: Die Seite führt die Satzstreifen und die Verbindungskarten ein. Ein Satzstreifen ist ein ganzer Satz mit Subjekt und Verb. Eine Verbindungskarte hängt zwei Streifen zu einem längeren Satz zusammen und sagt, wie sie zusammengehören. And fügt etwas hinzu, but zeigt einen Gegensatz, or lässt wählen, because nennt den Grund, so nennt die Folge und when sagt, wann etwas passiert. Vor because steht der Grund, vor so die Folge. Die Streifen bleiben ganze Sätze mit eigenem Subjekt. Kommas und andere Satzzeichen sind hier nicht Thema und zählen nicht als Fehler. Der Satz darf auch mit der Karte beginnen, zum Beispiel When it is sunny we play football. Nicht hier, weil es spätere Seiten sind. That-Sätze, Relativsätze und if-Sätze. Nicht hier, weil es spätere Kapitel sind. Although und whereas.
blocks:
  - type: section
    id: einstieg
    title: Zwei Streifen und eine Karte
    blocks:
      - type: figure
        image: images/szene-konjunktionen.svg
        alt: "Im Klassenzimmer hängt ein Brett mit zwei weißen Streifen: „Peter likes football.“ und „Amir likes football.“ Darunter hängen drei Karten: and, but und because. Sophie fragt in einer Sprechblase: „Which card fits?“ Neben Sophie stehen Peter, Ellie und Amir. Rechts steht Mr Hill."
        caption: "Von links: Sophie (Zöpfe), Peter (gelbe Jacke), Ellie (roter Pferdeschwanz), Amir (Brille) und Mr Hill (graue Haare). Peter und Amir haben die weißen Streifen geschrieben. Die bunten Pillen sind Verbindungskarten, es gibt sechs. Sophie fragt."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Mr Hill hat im Klassenzimmer ein Brett an die Rückwand gehängt: die **Satzstreifen-Wand**. Auf jedem **Streifen** steht ein ganzer Satz. Peter hat geschrieben: „Peter likes football.“ Amir hat geschrieben: „Amir likes football.“ Like heißt mögen, football heißt Fußball. Sophie fragt: „Which card fits?“ Das heißt: Welche Karte passt? Darunter hängen bunte **Verbindungskarten**. Eine Karte soll die zwei Streifen zu einem Satz verbinden.
      - type: single-choice
        id: konjunktionen-start
        text: Welche Karte verbindet die zwei Streifen zu einem Satz?
        options:
          - text: "and, wenn etwas dazukommt."
            correct: true
            info: Peter mag Fußball und Amir mag auch Fußball. Der zweite Streifen fügt etwas hinzu. Dafür steht and.
          - text: "but, wenn der zweite Streifen etwas ganz anderes sagt."
            correct: false
            info: Beide Streifen sagen dasselbe. Ein Gegensatz würde zu but passen, zum Beispiel „Peter likes football, but Amir likes tennis.“
          - text: "because, wenn der zweite Streifen einen Grund nennt."
            correct: false
            info: Dass Amir Fußball mag, ist kein Grund dafür, dass Peter Fußball mag. Because passt nur, wenn der zweite Streifen erklärt, warum der erste stimmt.
        explanation: Mit and kommt etwas dazu.
        links:
          - title: Lernlandkarte Englisch · Konjunktionen and, but, because
            url: https://lernapps.net/apps/map/englisch/c/konjunktionen/
      - type: text
        text: "**Das kannst du danach:** Du machst aus zwei kurzen Sätzen einen langen, mit and, but, or, because, so oder when. Du weißt, welche Karte wozu passt."
