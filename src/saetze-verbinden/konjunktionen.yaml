  - type: section
    id: neu
    title: Die Verbindungskarten
    blocks:
      - type: text
        text: "Ein **Streifen** ist ein ganzer Satz mit einem Subjekt und einem Verb. Eine **Verbindungskarte** hängt zwei Streifen aneinander. Jede Karte sagt, wie die zwei Streifen zusammengehören. Die Streifen bleiben ganze Sätze: Hinter der Karte kommt wieder ein Subjekt."
      - type: figure
        image: images/satzstreifen-konjunktionen.svg
        alt: "Oben ein Satz aus drei Teilen: ein weißer Streifen „Ellie is tired.“, eine orange Karte „so“ und ein weißer Streifen „she goes to bed early.“ Darunter sechs bunte Karten mit ihrer Bedeutung: and und, but aber, or oder, because weil, so deshalb, when wenn."
        caption: "Streifen, Karte, Streifen: „Ellie is tired“ heißt Ellie ist müde, „she goes to bed early“ heißt sie geht früh ins Bett. Jede Karte hat ihre Farbe. Unter jeder Karte steht, was sie bedeutet."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Klassenzimmer-Poster · Verbindungskarten
        header: [Karte, Bedeutung, Beispiel]
        rows:
          - [and, und (es kommt etwas dazu), Sophie reads a book and Ellie draws a picture.]
          - [but, aber (ein Gegensatz), Peter is small but he runs fast.]
          - [or, oder (du kannst wählen), You can take the bus or you can walk.]
          - [because, weil (der Grund), Ellie is happy because it is her birthday.]
          - [so, deshalb (die Folge), The bus is late so we walk.]
          - [when, wenn (wann es passiert), I read a book when it rains.]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Hinter because steht der Grund, hinter so die Folge.** Beide Sätze sagen dasselbe. Nur die Streifen tauschen die Plätze, und die Karte wechselt von because zu so: „We open the window because it is hot.“ ist dasselbe wie „It is hot so we open the window.“ Because und so stehen nie zusammen in einem Satz.
